# Configuración por defecto de un proyecto anega2. Cada projects/<nombre>/project.yml la sobreescribe.
nombre: proyecto
titulo: "Polígono sin título"
kml: lote.kml
crs: auto                      # "auto" = faja POSGAR 2007 por longitud (Argentina) o UTM; o un "EPSG:xxxx"
buffers:
  aoi_m: 500                   # radio del área de interés para reportar
  hidro_m: 10000               # radio del área de análisis hidrológico (acumulación, HAND)
  lluvia_m: 5000               # medio lado del dominio rain-on-grid
  grilla_m: 2000               # medio lado de la grilla de valores del visor (click)
dem:
  fuentes: [ign30, ign5, glo30, fabdem]
  primario: auto               # auto = fidelidad vs. arroyos OSM con preferencia por terreno desnudo; o ign30|glo30|fabdem
  umbrales_red_km2: [0.5, 2.0]
clima:
  fuentes: [era5, chirps]      # lluvia histórica en el centroide del lote
  hilos_chirps: 16             # lecturas CHIRPS en paralelo (la primera vez ≈ 25 min para 1981-hoy)
  eventos_n: 10                # tormentas mayores a listar
  separacion_d: 7              # días mínimos entre tormentas distintas
sar:
  umbral_fijo_dB: -18.0
  referencia_seca: {desde: "2023-01-15", hasta: "2023-03-31", descr: "Referencia seca: verano 2023 (sequía 2022-23)"}
  eventos: auto                # auto = tormentas mayores desde 2014 según la fase clima; o una lista [{id, fecha, descr}]
  pre_max_d: 12                # escena "antes": la última dentro de estos días previos
  post_max_d: 3                # escena "después": la primera dentro de estos días posteriores (si no hay: "sin pasada a tiempo")
lluvia:
  escenarios:
    - {id: P050_24h, P_mm: 50, dur_h: 24}
    - {id: P100_24h, P_mm: 100, dur_h: 24}
    - {id: P150_24h, P_mm: 150, dur_h: 24}
    - {id: P200_24h, P_mm: 200, dur_h: 24}
    - {id: P060_2h, P_mm: 60, dur_h: 2}
  saturado: [P100_24h, P150_24h]   # escenarios que se repiten con Ks_sat_mm_h (suelo saturado / napa alta)
  Ks_mm_h: 10.0
  Ks_sat_mm_h: 2.0
  manning: 0.05
  psi_m: 0.17
  dtheta: 0.15
  drenaje_h: 6                 # horas de simulación después de la lluvia
  presupuesto_min: 60          # tope de tiempo de cómputo por escenario
